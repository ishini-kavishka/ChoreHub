<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title description">
  <title id="title">ChoreHub application flow</title>
  <desc id="description">Unauthenticated onboarding and account flow leading to an authenticated app with five bottom tabs and secondary profile, calendar, and schedule screens.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7544e8"/>
      <stop offset="1" stop-color="#5736c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#242044" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8a82a8"/>
    </marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#28243b}
      .title{font-size:38px;font-weight:750;letter-spacing:.2px}
      .subtitle{font-size:16px;fill:#716b83}
      .section{font-size:15px;font-weight:750;letter-spacing:1.5px;fill:#6e43d6}
      .node{fill:#fff;stroke:#e6e0f2;stroke-width:1.5}
      .nodeText{font-size:17px;font-weight:650}
      .small{font-size:13px;fill:#777187}
      .line{fill:none;stroke:#958daa;stroke-width:2.5;marker-end:url(#arrow)}
      .lineNoArrow{fill:none;stroke:#c1bad0;stroke-width:2}
      .tab{fill:#fff;stroke:#e5dff0;stroke-width:1.5}
      .tabText{font-size:15px;font-weight:700}
      .tabIcon{fill:#7544e8}
    </style>
  </defs>

  <rect width="1400" height="1000" fill="url(#background)"/>
  <circle cx="1290" cy="90" r="135" fill="#e9e1ff" opacity=".42"/>
  <circle cx="90" cy="940" r="175" fill="#dff4ef" opacity=".48"/>

  <text x="700" y="67" text-anchor="middle" class="title">ChoreHub App Flow</text>
  <text x="700" y="98" text-anchor="middle" class="subtitle">Entry, authentication, main navigation and secondary screens</text>

  <rect x="55" y="130" width="1290" height="300" rx="24" fill="#fff" opacity=".78" stroke="#e7e1f2"/>
  <text x="85" y="169" class="section">01  ·  UNAUTHENTICATED FLOW</text>
  <text x="85" y="194" class="small">Shown before the user signs in</text>

  <g filter="url(#shadow)">
    <rect x="110" y="258" width="190" height="88" rx="18" class="node"/>
    <rect x="380" y="258" width="210" height="88" rx="18" class="node"/>
    <rect x="675" y="228" width="245" height="148" rx="20" fill="#fbf9ff" stroke="#dcd2f5" stroke-width="1.5"/>
    <rect x="1030" y="258" width="220" height="88" rx="18" class="node"/>
  </g>
  <path d="M300 302H370" class="line"/>
  <path d="M590 302H660" class="line"/>
  <path d="M920 276H1018" class="line"/>
  <path d="M920 328H970V392H1120V357" class="line"/>

  <text x="205" y="295" text-anchor="middle" class="nodeText">Splash</text>
  <text x="205" y="320" text-anchor="middle" class="small">App launch</text>
  <text x="485" y="295" text-anchor="middle" class="nodeText">Onboarding</text>
  <text x="485" y="320" text-anchor="middle" class="small">Introduction</text>
  <text x="797" y="263" text-anchor="middle" class="nodeText">Choose account action</text>
  <rect x="700" y="291" width="95" height="48" rx="13" fill="#f1ebff" stroke="#ddd0ff"/>
  <rect x="807" y="291" width="96" height="48" rx="13" fill="#f1ebff" stroke="#ddd0ff"/>
  <text x="747" y="321" text-anchor="middle" class="nodeText" font-size="15">Login</text>
  <text x="855" y="321" text-anchor="middle" class="nodeText" font-size="15">Create account</text>
  <text x="1140" y="295" text-anchor="middle" class="nodeText">OTP Verification</text>
  <text x="1140" y="320" text-anchor="middle" class="small">Account verification</text>

  <rect x="55" y="465" width="1290" height="480" rx="24" fill="#fff" opacity=".82" stroke="#e7e1f2"/>
  <text x="85" y="506" class="section">02  ·  AUTHENTICATED APP</text>
  <text x="85" y="531" class="small">After successful authentication · bottom tab bar</text>

  <path d="M1140 346V420H700V580" class="line"/>
  <g filter="url(#shadow)">
    <rect x="370" y="575" width="660" height="90" rx="22" fill="url(#accent)"/>
  </g>
  <text x="700" y="612" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">Authenticated user</text>
  <text x="700" y="638" text-anchor="middle" font-size="14" fill="#eee8ff">Main app · bottom tab bar visible</text>

  <path d="M700 665V702H170V735" class="lineNoArrow"/>
  <path d="M700 702H435V735" class="lineNoArrow"/>
  <path d="M700 702V735" class="lineNoArrow"/>
  <path d="M700 702H965V735" class="lineNoArrow"/>
  <path d="M700 702H1230V735" class="lineNoArrow"/>

  <g filter="url(#shadow)">
    <rect x="85" y="735" width="170" height="92" rx="17" class="tab"/>
    <rect x="350" y="735" width="170" height="92" rx="17" class="tab"/>
    <rect x="615" y="735" width="170" height="92" rx="17" class="tab"/>
    <rect x="880" y="735" width="170" height="92" rx="17" class="tab"/>
    <rect x="1145" y="735" width="170" height="92" rx="17" class="tab"/>
  </g>
  <circle cx="170" cy="770" r="10" class="tabIcon"/>
  <path d="M160 778Q170 766 180 778" fill="none" stroke="#7544e8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M425 760h20v20h-20zM430 756v8M440 756v8" fill="none" stroke="#7544e8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="700" cy="769" r="8" fill="none" stroke="#7544e8" stroke-width="2.5"/>
  <circle cx="689" cy="774" r="5" fill="none" stroke="#7544e8" stroke-width="2"/>
  <circle cx="711" cy="774" r="5" fill="none" stroke="#7544e8" stroke-width="2"/>
  <path d="M958 760h14v18h-14zM961 756h8M962 765h6M962 770h6" fill="none" stroke="#7544e8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1230" cy="765" r="8" fill="none" stroke="#7544e8" stroke-width="2.5"/>
  <path d="M1217 783Q1230 771 1243 783" fill="none" stroke="#7544e8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="170" y="809" text-anchor="middle" class="tabText">Home</text>
  <text x="435" y="809" text-anchor="middle" class="tabText">Chores</text>
  <text x="700" y="809" text-anchor="middle" class="tabText">Family</text>
  <text x="965" y="809" text-anchor="middle" class="tabText">Notifications</text>
  <text x="1230" y="809" text-anchor="middle" class="tabText">Profile</text>

  <path d="M170 827V854H385V875" class="line"/>
  <path d="M700 827V854H385V875" class="line"/>
  <path d="M1230 827V854H1035V875" class="line"/>
  <g>
    <rect x="285" y="875" width="200" height="48" rx="14" fill="#f5f1ff" stroke="#ded4f5"/>
    <rect x="930" y="875" width="210" height="48" rx="14" fill="#f5f1ff" stroke="#ded4f5"/>
  </g>
  <text x="385" y="905" text-anchor="middle" class="nodeText" font-size="15">Calendar · Schedule</text>
  <text x="1035" y="905" text-anchor="middle" class="nodeText" font-size="15">Settings · Preferences</text>

  <path d="M1230 827V854H1245V875" class="line"/>
  <rect x="1160" y="875" width="150" height="48" rx="14" fill="#fff3f2" stroke="#f0d1cf"/>
  <text x="1235" y="905" text-anchor="middle" class="nodeText" font-size="14">Support · Logout</text>
  <text x="700" y="972" text-anchor="middle" class="small">Profile also includes Notification Settings · Logout returns to the unauthenticated flow</text>
</svg>
